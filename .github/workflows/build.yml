name: Build AppImage

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Build AppImage
      run: npm run build

    - name: Upload AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux-AppImage
        path: dist/*.AppImage
